[package]
name = "klovy-chat-server"
version = "1.0.0"
edition = "2021"
default-run = "klovy-chat-server"
description = "Klovy Chat Backend"
license-file = "LICENSE"
autobins = false

[lib]
name = "klovy_chat_server"
path = "src/lib.rs"

[[bin]]
name = "klovy-chat-server"
path = "src/main.rs"

[[bin]]
name = "encrypt-old-messages"
path = "src/bin/encrypt_old_messages.rs"

[[bin]]
name = "migrate-storage-usage"
path = "src/bin/migrate_storage_usage.rs"

[[bin]]
name = "migrate-friend-request-pairs"
path = "src/bin/migrate_friend_request_pairs.rs"

[dependencies]
actix-web = "4"
actix-multipart = "0.7"
actix-web-lab = "0.20"

mongodb = "3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"

argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
jsonwebtoken = "9"
aes-gcm = "0.10"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
base32 = "0.5"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"

regex = "1"
lazy_static = "1"
once_cell = "1"

chrono = { version = "0.4", features = ["clock"] }

log = "0.4"
env_logger = "0.11"

tokio = { version = "1", features = ["full"] }
futures = "0.3"
futures-util = "0.3"

dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "stream"] }

axum = { version = "0.8", features = ["ws"] }
http = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
hex = "0.4"
unicode-general-category = "0.6"
zip = "2"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-s3 = "1"
webp = "0.3"
