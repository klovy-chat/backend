version: "3.8"

services:
  backend1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klovy-chat-backend1
    restart: always
    env_file:
      - .env
    environment:
      PORT: 6700
      INTERNAL_HTTP_PORT: 6705
    network_mode: "host"

  backend2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klovy-chat-backend2
    restart: always
    env_file:
      - .env
    environment:
      PORT: 6701
      INTERNAL_HTTP_PORT: 6706
    network_mode: "host"

  backend3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klovy-chat-backend3
    restart: always
    env_file:
      - .env
    environment:
      PORT: 6702
      INTERNAL_HTTP_PORT: 6707
    network_mode: "host"

  backend4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klovy-chat-backend4
    restart: always
    env_file:
      - .env
    environment:
      PORT: 6703
      INTERNAL_HTTP_PORT: 6708
    network_mode: "host"

  clamav:
    image: clamav/clamav:1.4
    container_name: klovy-chat-clamav
    restart: unless-stopped
    # Only localhost — clamd INSTREAM has no auth. Backend (host network):
    # CLAMAV_HOST=127.0.0.1:3310
    ports:
      - "127.0.0.1:3310:3310"
    security_opt:
      - no-new-privileges:true
    # Start: docker compose --profile scan up -d
    profiles:
      - scan
